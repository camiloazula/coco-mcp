# Verify the tree as `just check` does locally: everything on the cheapest
# runner, and the app again on macOS, the one platform its headless UI flows
# (`apps/desktop/tests/screenshots.rs`) draw on; elsewhere that target is
# empty. Nothing here builds for a platform or produces an artefact;
# `release.yml` does that, on version tags only.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The token only reads the repository; neither job writes to it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: System libraries GPUI and the keyring link against
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev \
            libwayland-dev libvulkan-dev
      - run: just notices-check
      - run: just fmt-check
      - run: just clippy
      - run: just test
      - run: just clippy-app
      - run: just test-app
      - name: Licences, bans, sources and advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: ""

  flows:
    name: flows (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      # The flows' own code is compiled on macOS only, so it is linted here.
      - run: just clippy-app
      - run: just test-app
      - name: The screens the flows drew
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: target/screenshots/
          if-no-files-found: ignore
