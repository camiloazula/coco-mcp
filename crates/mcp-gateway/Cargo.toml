[package]
name = "mcp-gateway"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "A local gateway that relays an agent's MCP traffic to the servers Coco knows, unchanged and recorded"

[dependencies]
mcp-core.workspace = true
axum.workspace = true
async-trait.workspace = true
bytes = "1"
futures.workspace = true
reqwest.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
tokio-util = { workspace = true, features = ["codec"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
mcp-mockserver.workspace = true
rmcp = { workspace = true, features = ["server", "transport-io"] }
anyhow.workspace = true

[lints]
workspace = true
